[General]
job_type = local
job_prefix = nextPolish
task = best
rewrite = yes
rerun = 3
parallel_jobs = 5
multithread_jobs = 5
genome = /tank/projects/Zubarev_sponge/Analysis/2025_11_19_NextPolish_SkHd3contigs/Nextdenovo_60x_pilon_purgedups_nomito_nobact.fasta
genome_size = 220000000
workdir = ./01_rundir
polish_options = -p {multithread_jobs}

[sgs_option]
sgs_fofn = ./sgs.fofn
sgs_options = -max_depth 100 -bwa

[lgs_option]
lgs_fofn = ./lgs.fofn
lgs_options = -min_read_len 5k -max_depth 100
lgs_minimap2_options = -x map-ont
